<div id="splash-screen" class="splash-screen">
  <!-- Siluet Sarang Tawon (Top & Bottom) -->
  <div class="splash-honeycomb splash-honeycomb-top"></div>
  <div class="splash-honeycomb splash-honeycomb-bottom"></div>

  <!-- Particle & Glowing Line Container -->
  <div class="splash-effects">
    <div class="splash-light-line"></div>
    <div class="splash-fireflies">
      <span class="firefly"></span>
      <span class="firefly"></span>
      <span class="firefly"></span>
      <span class="firefly"></span>
      <span class="firefly"></span>
    </div>
  </div>

  <!-- Logo Container -->
  <div class="splash-logo-wrap">
    <!-- DIBERSIHKAN: Filter relative_url ditambahkan -->
    <img 
      id="splash-logo-img" 
      src="{{ '/assets/images/logo.png' | relative_url }}" 
      alt="Logo Joya Rent Car" 
      class="splash-logo" 
      loading="eager"
    />
  </div>
</div>
