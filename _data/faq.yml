- question: "Apa saja syarat dan dokumen untuk sewa mobil lepas kunci?"
  category: "Persyaratan"
  answer: "Persyaratan sewa lepas kunci meliputi e-KTP, SIM A aktif, bukti kepemilikan tempat tinggal atau ID karyawan, serta akun media sosial aktif untuk proses verifikasi cepat tim kami."

- question: "Apakah tarif sewa sudah termasuk BBM, Tol, dan Driver?"
  category: "Layanan"
  answer: "Kami menyediakan opsi **Sewa Lepas Kunci** dan **Dengan Driver**. Untuk paket dengan Driver, Anda bisa memilih paket All-In (termasuk BBM, Tol, Parkir, & Uang Makan Driver) atau hanya jasa Driver saja."

- question: "Bagaimana prosedur pemesanan dan ketentuan DP reservasi?"
  category: "Pembayaran"
  answer: "Reservasi dianggap sah setelah melakukan DP minimal 30%. Pelunasan dapat dilakukan saat serah terima armada di lokasi Anda atau sebelum perjalanan dimulai."

- question: "Bagaimana jika armada mengalami kendala mekanis atau darurat?"
  category: "Keamanan"
  answer: "Seluruh armada Joya Rent Car selalu melalui inspeksi rutin & tercover asuransi. Jika terjadi kendala di jalan, tim Support 24/7 kami siap memberikan bantuan teknis atau penggantian unit sekelas."

- question: "Berapa lama durasi sewa per hari dan bagaimana biaya overtime-nya?"
  category: "Ketentuan"
  answer: "Durasi sewa harian dihitung 12 jam atau per-tanggal (fullday hingga pukul 23.59). Overtime dikenakan biaya tambahan sebesar 10% per jam dari harga sewa harian."

- question: "Apakah armada Joya Rent Car bisa digunakan untuk perjalanan luar kota?"
  category: "Layanan"
  answer: "Bisa banget! Seluruh unit kami siap untuk perjalanan dalam maupun luar kota. Harap menginformasikan kota tujuan Anda saat konfirmasi booking ke admin kami."
